<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crispy Chicken Checkout</title><style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}

body{
background:#f5f5f5;
padding:20px;
background: url('https://images.unsplash.com/photo-1600891964599-f61ba0e24092') no-repeat center center/cover;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,.1);
}

h1{
text-align:center;
margin-bottom:20px;
color:#ff6600;
}

.order-item{
display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid #ddd;
}

.total{
margin-top:20px;
font-size:22px;
font-weight:bold;
text-align:right;
color:#ff6600;
}

form{
margin-top:25px;
}

input,
select{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:none;
background:#28a745;
color:white;
font-size:18px;
border-radius:10px;
cursor:pointer;
}

button:hover{
box-shadow:0 0 15px #28a745;
}

@media(max-width:768px){
.container{
padding:15px;
}
}
</style></head>

<button class="close-button" onclick="goHome()" >X</button>

<style>
    .close-button{
        background-color: red;
        border-radius: 50px;
        max-width: fit-content;
        margin-left: 1400px;
        
    }

    .container{
        background-color: darkgray;
    }
</style>

<script>
    function goHome()
    {
        window.location.href = "index.html"
    }
</script>



<body><div class="container"><h1>🍗 Crispy Chicken Checkout </h1><div id="order-list"></div><div class="total">
Total: ₹<span id="grand-total">0</span>
</div><form id="checkout-form"><input
type="text"
placeholder="Full Name"
required>

<input
type="number"
placeholder="Phone Number"
required>

<input
type="text"
placeholder="Delivery Address"
required>

<select required>
<option value="">
Select Payment Method
</option><option>
Cash On Delivery
</option><option>
UPI Payment
</option><option>
Credit / Debit Card
</option>
</select><button type="submit">
Place Order
</button></form></div><script>

let cart =
JSON.parse(localStorage.getItem("cart"))
|| [];

const orderList =
document.getElementById("order-list");

const totalEl =
document.getElementById("grand-total");

let total = 0;

cart.forEach(item=>{

total += item.price * item.qty;

orderList.innerHTML += `
<div class="order-item">
<span>
${item.name}
(x${item.qty})
</span>

<span>
₹${item.price * item.qty}
</span>
</div>
`;

});

totalEl.innerText = total;

document
.getElementById("checkout-form")
.addEventListener("submit",(e)=>{

e.preventDefault();

alert(
"🎉 Order Placed Successfully!\nThank you for ordering from Crispy Chicken."
);

localStorage.removeItem("cart");

window.location.href="index.html";

});

</script></body>
</html>
